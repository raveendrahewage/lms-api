trigger:
  - master

pool:
  vmImage: "ubuntu-latest"

variables:
  buildConfiguration: "Release"

  # Azure resources
  azureServiceConnection: "Azure subscription 1(1)(26a2e343-0fd6-4f21-b3d7-d4dca09b50c2)"
  keyVaultName: "lms-app-dev-kv"
  appServiceName: "lms-api"

  # Projects
  apiProject: "LMS.API/LMS.API.csproj"
  dataProject: "LMS.Data/LMS.Data.csproj"

steps:
  # ============================================================
  # 1. Install .NET 10 SDK
  # ============================================================

  - task: UseDotNet@2
    displayName: "Use .NET 10 SDK"
    inputs:
      packageType: "sdk"
      version: "10.x"

  # ============================================================
  # 2. Display .NET Information
  # ============================================================

  - script: |
      dotnet --info
    displayName: "Display .NET Information"

  # ============================================================
  # 3. Restore NuGet Packages
  # ============================================================

  - task: DotNetCoreCLI@2
    displayName: "Restore Dependencies"
    inputs:
      command: "restore"
      projects: "**/*.csproj"

  # ============================================================
  # 4. Build Solution
  # ============================================================

  - task: DotNetCoreCLI@2
    displayName: "Build Solution"
    inputs:
      command: "build"
      projects: "**/*.csproj"
      arguments: "--configuration $(buildConfiguration) --no-restore"

  # ============================================================
  # 5. Run Unit Tests
  # ============================================================

  # Uncomment if you have test projects

  # - task: DotNetCoreCLI@2
  #   displayName: 'Run Unit Tests'
  #   inputs:
  #     command: 'test'
  #     projects: '**/*Tests/*.csproj'
  #     arguments: '--configuration $(buildConfiguration) --no-build'
  #     publishTestResults: true

  # ============================================================
  # 6. Install EF Core CLI
  # ============================================================

  - script: |
      dotnet tool install --global dotnet-ef --version 10.*
      echo "##vso[task.prependpath]$HOME/.dotnet/tools"

      dotnet ef --version
    displayName: "Install EF Core CLI"

  # ============================================================
  # 7. Get Database Connection String from Azure Key Vault
  # ============================================================

  - task: AzureKeyVault@2
    displayName: "Get Database Connection String from Key Vault"
    inputs:
      azureSubscription: "$(azureServiceConnection)"
      KeyVaultName: "$(keyVaultName)"
      SecretsFilter: "ConnectionStrings--LMSDbConnection"
      RunAsPreJob: false

  # ============================================================
  # 8. Verify Connection String Was Retrieved
  # ============================================================

  # Do NOT print the actual connection string.
  # This only verifies that the secret exists.

  - script: |
      if [ -z "$(ConnectionStrings--LMSDbConnection)" ]; then
        echo "ERROR: ConnectionStrings--LMSDbConnection was not retrieved from Azure Key Vault."
        exit 1
      fi

      echo "Database connection string retrieved successfully from Key Vault."
    displayName: "Validate Key Vault Secret"

  # ============================================================
  # 9. Check EF Core Migrations
  # ============================================================

  - script: |
      dotnet ef migrations list \
        --project "$(dataProject)" \
        --startup-project "$(apiProject)" \
        --configuration "$(buildConfiguration)" \
        --connection "$(ConnectionStrings--LMSDbConnection)"
    displayName: "Check EF Core Migrations"

  # ============================================================
  # 10. Apply EF Core Database Migrations
  # ============================================================

  - script: |
      dotnet ef database update \
        --project "$(dataProject)" \
        --startup-project "$(apiProject)" \
        --configuration "$(buildConfiguration)" \
        --connection "$(LmsDbConnectionString)"
    displayName: "Apply Database Migrations"

  # ============================================================
  # 11. Publish API
  # ============================================================

  - task: DotNetCoreCLI@2
    displayName: "Publish API"
    inputs:
      command: "publish"
      publishWebProjects: false
      projects: "$(apiProject)"
      arguments: "--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/app"
      zipAfterPublish: true

  # ============================================================
  # 12. Publish Build Artifacts
  # ============================================================

  - task: PublishBuildArtifacts@1
    displayName: "Publish Artifacts"
    inputs:
      PathtoPublish: "$(Build.ArtifactStagingDirectory)"
      ArtifactName: "drop"
      publishLocation: "Container"

  # ============================================================
  # 13. Deploy API to Azure App Service
  # ============================================================

  - task: AzureWebApp@1
    displayName: "Deploy to Azure App Service"
    inputs:
      azureSubscription: "$(azureServiceConnection)"
      appType: "webApp"
      appName: "$(appServiceName)"
      package: "$(Build.ArtifactStagingDirectory)/app/*.zip"
      deploymentMethod: "auto"
